name: Production DevSecOps Multi-Stage Pipeline

on:
  push:
    branches:
      - main

jobs:
  code-security:
    name: Code Security & Secrets Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2

  infra-scan:
    name: Infrastructure Compliance (Checkov)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run Checkov
        uses: bridgecrewio/checkov-action@master
        with:
          directory: terraform
          framework: terraform
          skip_check: CKV_TF_1,CKV_TF_2

  build-backend:
    name: Build Backend Service
    runs-on: ubuntu-latest
    needs: [code-security, infra-scan]

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-south-1

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build & Push Backend
        run: |
          docker build -t 486036174293.dkr.ecr.ap-south-1.amazonaws.com/skillpulse-backend:${{ github.sha }} ./backend
          docker push 486036174293.dkr.ecr.ap-south-1.amazonaws.com/skillpulse-backend:${{ github.sha }}

  build-frontend:
    name: Build Frontend Service
    runs-on: ubuntu-latest
    needs: [code-security, infra-scan]

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-south-1

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build & Push Frontend
        run: |
          docker build -t 486036174293.dkr.ecr.ap-south-1.amazonaws.com/skillpulse-frontend:${{ github.sha }} ./frontend
          docker push 486036174293.dkr.ecr.ap-south-1.amazonaws.com/skillpulse-frontend:${{ github.sha }}

  deploy-dev:
    name: Deploy to EKS Dev
    runs-on: ubuntu-latest
    needs: [build-backend, build-frontend]

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-south-1

      - name: Update kubeconfig
        run: aws eks update-kubeconfig --region ap-south-1 --name skillpulse-dev

      - name: Deploy manifests
        run: |
          kubectl apply -f k8s/core/
          kubectl apply -f k8s/mysql/
          kubectl apply -f k8s/skillpulse/

      - name: Update images
        run: |
          kubectl set image deployment/backend backend=486036174293.dkr.ecr.ap-south-1.amazonaws.com/skillpulse-backend:${{ github.sha }} -n skillpulse
          kubectl set image deployment/frontend frontend=486036174293.dkr.ecr.ap-south-1.amazonaws.com/skillpulse-frontend:${{ github.sha }} -n skillpulse

  smoke-test:
    name: Application Smoke Test
    runs-on: ubuntu-latest
    needs: deploy-dev

    steps:
      - name: Test frontend
        run: curl -I http://a2ae55a863f6344a782726b510f1f071-641008221.ap-south-1.elb.amazonaws.com

  telemetry-check:
    name: Monitoring Health Check
    runs-on: ubuntu-latest
    needs: smoke-test

    steps:
      - name: Check Grafana
        run: curl -I http://a2ae55a863f6344a782726b510f1f071-641008221.ap-south-1.elb.amazonaws.com/grafana
