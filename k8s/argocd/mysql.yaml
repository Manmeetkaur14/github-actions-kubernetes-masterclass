apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: skillpulse-mysql
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/Kanhaiya-Tiwari/github-actions-kubernetes-masterclass.git
    targetRevision: HEAD
    path: k8s/mysql
  destination:
    server: https://kubernetes.default.svc
    namespace: skillpulse
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
